<p *ngIf="cargando()">Cargando...</p>

<form class="form-pelicula" *ngIf="!cargando()" [formGroup]="form" (ngSubmit)="guardar()">
    <h3>{{ editando() ? 'Editar "' + editando().nombre + '"' : 'Nueva película' }}</h3>

    <p class="error" *ngIf="error()">{{ error() }}</p>

    <div class="grilla">
        <label class="ancho">Nombre
            <input type="text" formControlName="nombre">
        </label>

        <label class="ancho">Sinopsis
            <textarea rows="3" formControlName="sinopsis"></textarea>
        </label>

        <label class="ancho">URL de la imagen
            <input type="text" formControlName="imagen_url" placeholder="https://...">
        </label>

        <label>Duración (min)
            <input type="number" formControlName="duracion" min="1">
        </label>

        <label>Formato
            <select formControlName="formato">
                <option *ngFor="let f of ['2D', '3D', '4D', '5D']" [ngValue]="f">{{ f }}</option>
            </select>
        </label>

        <label>Idioma
            <select formControlName="idioma">
                <option [ngValue]="'Castellano'">Castellano</option>
                <option [ngValue]="'Subtitulada'">Subtitulada</option>
            </select>
        </label>

        <label>Clasificación
            <select formControlName="clasificacion_edad">
                <option [ngValue]="0">ATP</option>
                <option [ngValue]="13">+13</option>
                <option [ngValue]="18">+18</option>
            </select>
        </label>

        <label>Precio normal
            <input type="number" formControlName="precio_normal" min="1">
        </label>

        <label>Precio preventa
            <input type="number" formControlName="precio_preventa" min="1">
        </label>

        <div class="ancho">
            <span class="etiqueta">Fecha de estreno</span>
            <div class="fecha-selects">
                <select formControlName="diaEstreno" aria-label="Día">
                    <option [ngValue]="null" disabled>Día</option>
                    <option *ngFor="let d of dias" [ngValue]="d">{{ d }}</option>
                </select>
                <select formControlName="mesEstreno" aria-label="Mes">
                    <option [ngValue]="null" disabled>Mes</option>
                    <option *ngFor="let m of meses; let i = index" [ngValue]="i + 1">{{ m }}</option>
                </select>
                <select formControlName="anioEstreno" aria-label="Año">
                    <option [ngValue]="null" disabled>Año</option>
                    <option *ngFor="let a of anios" [ngValue]="a">{{ a }}</option>
                </select>
            </div>
            <p class="error" *ngIf="form.hasError('fechaInvalida')">Esa fecha no existe.</p>
        </div>

        <div class="ancho">
            <span class="etiqueta">Géneros</span>
            <div class="chips">
                <button type="button" class="chip" *ngFor="let g of generos()"
                    [class.activo]="generoElegido(g.id)" (click)="toggleGenero(g.id)">
                    {{ g.nombre }}
                </button>
            </div>
            <p class="error" *ngIf="form.get('generos')?.touched && form.get('generos')?.invalid">Elegí al menos un género.</p>
        </div>
    </div>

    <div class="acciones">
        <button type="button" class="btn-secundario" (click)="cancelar()">Cancelar</button>
        <button type="submit" class="btn-principal" [disabled]="guardando()">
            {{ guardando() ? 'Guardando...' : 'Guardar' }}
        </button>
    </div>
</form>
