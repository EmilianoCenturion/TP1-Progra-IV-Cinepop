<div class="home">
    <section>
        <h2>Top 3 mas vendidas</h2>

        <ul class="catalogo">
            <li class="card-pelicula" *ngFor="let pelicula of top3()">
                <app-card-pelicula [pelicula]="pelicula" (seleccionada)="verPelicula($event)"></app-card-pelicula>
            </li>
        </ul>
        
    </section>

    <section>
        <h2>Reseñas recientes</h2>

        <ul class="lista-resenas">
            <li class="resena" *ngFor="let resena of resenas()">
                <img class="resena-poster" [src]="resena.peliculas.imagen_url" [alt]="resena.peliculas.nombre">

                <div class="resena-cuerpo">
                    <h3>{{ resena.peliculas.nombre }}</h3>

                    <div class="resena-meta">
                        <span class="resena-usuario">{{ resena.usuarios.nombre }}</span>
                        <span class="resena-estrellas">
                        <span *ngFor="let n of estrellas" [class.llena]="n <= resena.calificacion">★</span>
                        </span>
                    </div>

                    <p class="resena-comentario">{{ resena.comentario }}</p>
                </div>
            </li>
        </ul>
    </section>
</div>
