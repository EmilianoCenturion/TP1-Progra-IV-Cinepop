<nav class="nav-principal" *ngIf="!ocultarNav()">
    <a routerLink="/home" class="nav-logo">
        <img src="/logo-cinepop.png" alt="Cinepop" class="logo-img-nav">
    </a>

    <ng-container *ngIf="usuarioLogueado()">
        <div class="busqueda-nav">
            <input type="text" class="buscador" [(ngModel)]="filtro" placeholder="Buscar película..." (input)="buscarEnvio()">

            <button type="button" class="btn-buscar" *ngIf="mostrarLupa()" (click)="buscarEnCartelera()" aria-label="Buscar">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></g></svg>
            </button>

        </div>

        <div class="nav-links">
            <a routerLink="/home" routerLinkActive="activo">Inicio</a>
            <a routerLink="/cartelera" routerLinkActive="activo">Cartelera</a>
            <a *appRolAdmin="'Admin'" routerLink="/admin" routerLinkActive="activo">Panel de admin</a>
        </div>
    </ng-container>

    <div class="nav-links" *ngIf="!usuarioLogueado()">
        <a routerLink="/login" routerLinkActive="activo">Ingresar</a>
        <a routerLink="/registro" routerLinkActive="activo">Registrarme</a>
    </div>
</nav>
